<div class="page-header">
  <h2>Dealers</h2>
  @if (auth.isAdmin()) {
    <button pButton icon="pi pi-plus" label="Add Dealer" (click)="openCreate()"></button>
  }
</div>

<div class="surface-card">
  <p-table [value]="dealerService.dealers()" [loading]="dealerService.loading()" responsiveLayout="stack" [breakpoint]="'768px'">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Mobile</th>
        <th>Outstanding Balance</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-dealer>
      <tr class="clickable-row" (click)="viewDetails(dealer)">
        <td>{{ dealer.name }}</td>
        <td>{{ dealer.mobile || '—' }}</td>
        <td [class.negative-balance]="outstandingFor(dealer) > 0">{{ outstandingFor(dealer) | inrCurrency }}</td>
        <td>
          <p-tag [severity]="dealer.active ? 'success' : 'danger'" [value]="dealer.active ? 'Active' : 'Inactive'"></p-tag>
        </td>
        <td>
          @if (auth.isAdmin()) {
            <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="openEdit(dealer, $event)"></button>
          }
          <button pButton icon="pi pi-eye" class="p-button-text p-button-sm" (click)="viewDetails(dealer)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="5">No dealers yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="dialogOpen" [modal]="true" [style]="{width: '460px'}" [header]="editing() ? 'Edit Dealer' : 'Add Dealer'">
  <form [formGroup]="form" (ngSubmit)="save()" class="dialog-form">
    <div class="field">
      <label for="name">Dealer Name</label>
      <input id="name" pInputText formControlName="name" class="w-full" />
    </div>
    <div class="field">
      <label for="mobile">Mobile Number</label>
      <input id="mobile" pInputText formControlName="mobile" class="w-full" />
    </div>
    <div class="field">
      <label for="address">Address</label>
      <textarea id="address" pTextarea formControlName="address" class="w-full" rows="2"></textarea>
    </div>
    <div class="field">
      <label for="openingBalance">Opening Balance</label>
      <p-inputNumber id="openingBalance" formControlName="openingBalance" mode="currency" currency="INR" locale="en-IN" [min]="0" styleClass="w-full"></p-inputNumber>
    </div>
    <div class="field">
      <label for="notes">Notes</label>
      <textarea id="notes" pTextarea formControlName="notes" class="w-full" rows="2"></textarea>
    </div>
    <div class="field field-inline">
      <label>Active</label>
      <p-toggleswitch formControlName="active"></p-toggleswitch>
    </div>
    <div class="dialog-actions">
      <button pButton type="button" label="Cancel" class="p-button-text" (click)="dialogOpen.set(false)"></button>
      <button pButton type="submit" label="Save" icon="pi pi-check" [loading]="submitting()"></button>
    </div>
  </form>
</p-dialog>
