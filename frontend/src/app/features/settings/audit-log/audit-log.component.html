<div class="page-header">
  <h2>Audit Log</h2>
</div>

<div class="surface-card filters">
  <div class="filter-field">
    <label>Entity Type</label>
    <p-select [ngModel]="entityType()" (ngModelChange)="entityType.set($event); applyFilter()" [options]="entityTypeOptions" optionLabel="label" optionValue="value" [showClear]="true" placeholder="All types"></p-select>
  </div>
  <div class="filter-field">
    <label>From</label>
    <p-datepicker [ngModel]="dateFrom()" (ngModelChange)="dateFrom.set($event); applyFilter()" dateFormat="dd-mm-yy" [showIcon]="true" [showButtonBar]="true"></p-datepicker>
  </div>
  <div class="filter-field">
    <label>To</label>
    <p-datepicker [ngModel]="dateTo()" (ngModelChange)="dateTo.set($event); applyFilter()" dateFormat="dd-mm-yy" [showIcon]="true" [showButtonBar]="true"></p-datepicker>
  </div>
</div>

<div class="surface-card">
  <p-table [value]="auditLogService.entries()" [loading]="auditLogService.loading()" [paginator]="true" [rows]="25" responsiveLayout="stack" [breakpoint]="'768px'">
    <ng-template pTemplate="header">
      <tr>
        <th>When</th><th>User</th><th>Action</th><th>Entity</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-entry>
      <tr>
        <td><span class="p-datatable-column-title">When</span>{{ entry.createdAt | date: 'dd-MM-yyyy HH:mm' }}</td>
        <td><span class="p-datatable-column-title">User</span>{{ entry.userName || 'System' }}</td>
        <td><span class="p-datatable-column-title">Action</span><p-tag [severity]="severityFor(entry.action)" [value]="entry.action"></p-tag></td>
        <td class="capitalize"><span class="p-datatable-column-title">Entity</span>{{ entry.entityType }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="4">No audit entries found for the selected filters.</td></tr>
    </ng-template>
  </p-table>
</div>
