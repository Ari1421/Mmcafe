<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <i class="pi pi-key"></i>
      <h1>Reset Password</h1>
      <p>We'll email you a reset link</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="w-full"></p-message>
      }
      @if (successMessage()) {
        <p-message severity="success" [text]="successMessage()!" styleClass="w-full"></p-message>
      }

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" pInputText formControlName="email" class="w-full" placeholder="you@example.com" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <small class="form-error">Please enter a valid email address.</small>
        }
      </div>

      <button pButton type="submit" label="Send Reset Link" icon="pi pi-send" class="w-full" [loading]="submitting()"></button>

      <a routerLink="/login" class="forgot-link">Back to login</a>
    </form>
  </div>
</div>
