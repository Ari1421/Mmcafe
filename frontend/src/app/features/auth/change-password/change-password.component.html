<div class="page-container">
  <h2>Change Password</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="change-password-form">
    @if (form.errors?.['mismatch'] && form.touched) {
      <p-message severity="error" text="Passwords do not match." styleClass="w-full"></p-message>
    }

    <div class="field">
      <label for="newPassword">New Password</label>
      <p-password id="newPassword" formControlName="newPassword" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm New Password</label>
      <p-password id="confirmPassword" formControlName="confirmPassword" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full"></p-password>
    </div>

    <button pButton type="submit" label="Update Password" icon="pi pi-check" [loading]="submitting()"></button>
  </form>
</div>
